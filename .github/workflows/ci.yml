name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"

# Cancel outdated runs for the same PR/branch when newer commits arrive.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.11.2

      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @visionhub/api exec prisma validate
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

      - uses: docker/setup-buildx-action@v3

      - name: Build API Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/api.Dockerfile
          tags: visionhub-api:ci
          push: false
          cache-from: type=gha,scope=visionhub-api
          cache-to: type=gha,scope=visionhub-api,mode=max

      - name: Build Web Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/web.Dockerfile
          tags: visionhub-web:ci
          push: false
          cache-from: type=gha,scope=visionhub-web
          cache-to: type=gha,scope=visionhub-web,mode=max
