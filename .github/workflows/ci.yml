name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.11.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @visionhub/api exec prisma validate
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Build API Docker image
        run: docker build -f deploy/api.Dockerfile -t visionhub-api:ci .
      - name: Build Web Docker image
        run: docker build -f deploy/web.Dockerfile -t visionhub-web:ci .
