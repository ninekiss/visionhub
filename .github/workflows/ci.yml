name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"

# Cancel outdated runs for the same PR/branch when newer commits arrive.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.11.2

      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @visionhub/api exec prisma validate
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

      - uses: docker/setup-buildx-action@v3

      - name: Validate Compose deployment modes
        env:
          DATABASE_URL: postgresql://build:build@127.0.0.1:5433/visionhub?schema=visionhub
          DATABASE_URL_DOCKER: postgresql://build:build@postgres:5432/visionhub?schema=visionhub
          POSTGRES_DB: visionhub
          POSTGRES_USER: build
          POSTGRES_PASSWORD: build
          POSTGRES_PORT: "5433"
          EXISTING_DB_NETWORK: visionhub-db-ci
          API_PORT: "3000"
        run: |
          docker compose -f infra/compose.yaml config --quiet
          docker compose -f infra/compose.yaml config --format json > /tmp/visionhub-compose-default.json
          node -e "const c = JSON.parse(require('node:fs').readFileSync('/tmp/visionhub-compose-default.json', 'utf8')); if (c.services.postgres) throw new Error('PostgreSQL must remain opt-in'); if ((c.services.api.ports ?? []).length) throw new Error('API host port must remain unpublished by default');"
          docker compose -f infra/compose.yaml -f infra/compose.database.yaml config --quiet
          docker compose -f infra/compose.yaml -f infra/compose.database.yaml config --format json > /tmp/visionhub-compose-database.json
          node -e "const c = JSON.parse(require('node:fs').readFileSync('/tmp/visionhub-compose-database.json', 'utf8')); if (!c.services.postgres.volumes.some(v => v.target === '/var/lib/postgresql')) throw new Error('PostgreSQL 18 data volume must target /var/lib/postgresql');"
          docker compose -f infra/compose.yaml -f infra/compose.existing-db-network.yaml config --quiet
          docker compose -f infra/compose.yaml -f infra/compose.api-published.yaml config --quiet

      - name: Build API Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/api.Dockerfile
          tags: visionhub-api:ci
          push: false
          cache-from: type=gha,scope=visionhub-api
          cache-to: type=gha,scope=visionhub-api,mode=max

      - name: Build Web Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/web.Dockerfile
          tags: visionhub-web:ci
          push: false
          cache-from: type=gha,scope=visionhub-web
          cache-to: type=gha,scope=visionhub-web,mode=max
