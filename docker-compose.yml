services:
  api:
    build:
      context: .
      dockerfile: deploy/api.Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL_DOCKER:-${DATABASE_URL}}
      APP_CONFIG_PATH: /app/configs/app.production.yaml
    ports:
      - "${API_PORT:-3000}:3000"
    volumes:
      - ./configs/app.production.yaml:/app/configs/app.production.yaml:ro
    networks:
      - app
      - existing_db

  web:
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - api
    networks:
      - app

networks:
  app:
    driver: bridge
  existing_db:
    external: true
    name: ${EXISTING_DB_NETWORK}
