services:
  api:
    # This overlay selects the Compose-managed database regardless of a stale
    # DATABASE_URL_DOCKER value configured for another deployment mode.
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD before starting the optional database}@postgres:5432/${POSTGRES_DB:-visionhub}?schema=visionhub
    depends_on:
      backup:
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD before starting the optional database}@postgres:5432/${POSTGRES_DB:-visionhub}?schema=visionhub
      PGDATA: /var/lib/postgresql/18/docker
      DB_TOOLS_PHYSICAL_ENABLED: "true"
      BACKUP_DATABASE_MODE: managed
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - postgres_data:/var/lib/postgresql

  postgres:
        condition: service_healthy

  db-tools:
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD before starting the optional database}@postgres:5432/${POSTGRES_DB:-visionhub}?schema=visionhub
      PGDATA: /var/lib/postgresql/18/docker
      DB_TOOLS_PHYSICAL_ENABLED: "true"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - postgres_data:/var/lib/postgresql

  postgres:
    image: visionhub-postgres:18
    build:
      context: ..
      dockerfile: deploy/postgres.Dockerfile
      args:
        POSTGRES_IMAGE: ${POSTGRES_IMAGE:-postgres:18-alpine}
    # PostgreSQL incremental base backups require WAL summarization. Keep
    # summaries longer than the default to cover the weekly full-backup cycle.
    command: ["postgres", "-c", "summarize_wal=on", "-c", "wal_summary_keep_time=30d"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-visionhub}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD before starting the optional database}
      PGDATA: /var/lib/postgresql/18/docker
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - app

volumes:
  postgres_data:
