services:
  api:
    networks:
      - app
      - existing_db
  db-tools:
    networks:
      - app
      - existing_db
  backup:
    environment:
      BACKUP_DATABASE_MODE: network
    networks:
      - app
      - existing_db

networks:
  existing_db:
    external: true
    name: ${EXISTING_DB_NETWORK:?Set EXISTING_DB_NETWORK to the existing database network}
