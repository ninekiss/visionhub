# Generic configuration example. Normal use should pick the environment-specific
# file: app.development.yaml for local development, app.production.yaml for Compose.
app:
  name: VisionHub
  environment: development
  basePath: /api/v1

server:
  host: 0.0.0.0
  port: 3001
  corsOrigins:
    - http://localhost:5173
    - http://127.0.0.1:5173

web:
  title: VisionHub
  apiBaseUrl: /api/v1

player:
  autoplay: false
  muted: false
  controls:
    - play-large
    - play
    - progress
    - current-time
    - duration
    - mute
    - volume
    - settings
    - pip
    - fullscreen

catalog:
  pageSize: 8
